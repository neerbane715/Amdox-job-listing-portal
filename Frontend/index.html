<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal - Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container" id="container">
        <!-- Sign Up Container -->
        <div class="form-container sign-up-container">
            <form action="#">
                <h1>Create Account</h1>
                <div class="toggle-container user-type-toggle">
                    <button type="button" class="toggle-btn active" data-type="seeker">Candidate</button>
                    <button type="button" class="toggle-btn" data-type="employer">Employer</button>
                </div>
                <!-- Social Container -->

                <input type="text" placeholder="Full Name" id="signUpName" />
                <input type="text" placeholder="Company Name" class="company-field collapsed" id="signUpCompany" />
                <input type="email" placeholder="Email" id="signUpEmail" />
                <input type="password" placeholder="Password" id="signUpPassword" />
                <button type="submit" id="signUpSubmit">Sign Up</button>
            </form>
        </div>

        <!-- Sign In Container -->
        <div class="form-container sign-in-container">
            <form action="#">
                <h1>Sign in</h1>
                <div class="toggle-container user-type-toggle">
                    <button type="button" class="toggle-btn active" data-type="seeker">Candidate</button>
                    <button type="button" class="toggle-btn" data-type="employer">Employer</button>
                </div>

                <input type="email" placeholder="Email" id="signInEmail" />
                <input type="password" placeholder="Password" id="signInPassword" />
                <a href="#">Forgot your password?</a>
                <button type="submit" id="signInSubmit">Sign In</button>
            </form>
        </div>

        <!-- Overlay Container -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>Log in to access your account and continue growing.</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Join Us!</h1>
                    <p>Start your journey with us and unlock new opportunities.</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
